name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version: "1.26.11" }
      - name: Go vet and tests
        run: go vet ./... && go test ./...
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: No third-party scripts or styles (strict CSP, no trackers)
        run: "! grep -nE '<script[^>]+src=\"https?:|<link[^>]+href=\"https?:' ui/index.html"
      - name: Image builds
        run: docker build -t gjallar-web:ci .
