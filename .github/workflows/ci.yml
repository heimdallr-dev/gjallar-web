name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.11" }
      - name: Go vet and tests
        run: go vet ./... && go test ./...
      - name: JavaScript syntax
        run: node --check ui/app.js
      - name: No third-party scripts or styles (strict CSP, no trackers)
        run: "! grep -nE '<script[^>]+src=\"https?:|<link[^>]+href=\"https?:' ui/index.html"
      - name: Image builds
        run: docker build -t gjallar-web:ci .
