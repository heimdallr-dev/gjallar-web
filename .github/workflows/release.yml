# Tag vX.Y.Z → multi-arch ghcr.io/<owner>/gjallar-web:X.Y.Z, signed with
# Sigstore (keyless) with an SBOM and SLSA provenance, like the core images.
# Use the same version as the core release the UI goes with.
name: release
on: { push: { tags: ["v*"] } }
permissions: { contents: read }
jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write, id-token: write, attestations: write }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gjallar-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - id: v  # image tags match the chart's appVersion: v0.1.0 -> 0.1.0
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          push: true
          sbom: true
          provenance: mode=max
      - if: ${{ !github.event.repository.private }}  # public Sigstore (Rekor) is a public log: only for public repos
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - if: ${{ !github.event.repository.private }}  # public Sigstore (Rekor) is a public log: only for public repos
        name: Sign (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - if: ${{ !github.event.repository.private }}  # public Sigstore (Rekor) is a public log: only for public repos
        uses: anchore/sbom-action@9246b90769f852b3a8921f330c59e0b3f439d6e9 # v0.20.1
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-release-assets: false
      - if: ${{ !github.event.repository.private }}  # public Sigstore (Rekor) is a public log: only for public repos
        name: Attach the SBOM as a signed attestation
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
        env: { DIGEST: "${{ steps.build.outputs.digest }}" }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.build.outputs.digest }}", push-to-registry: true }
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
